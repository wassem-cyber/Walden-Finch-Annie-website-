<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Box — Walden &amp; Finch</title>
<link rel="icon" type="image/png" href="../assets/logo-black.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#1d2a22;--mute:#5d6b62;--acc:#2e7d4a;--on:#fff;--line:#dfe6e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:2.1rem;font-weight:800;margin:8px 0 14px;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:22px 0 8px}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{min-height:110px;resize:vertical}
label{display:block;margin:14px 0 4px;font-weight:600}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:12px 18px;font-weight:600;cursor:pointer}
.ghost{background:none;border:0;color:var(--acc);padding:8px 0;cursor:pointer;font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.btn.wide{width:100%;padding:12px;border:1px solid var(--acc);line-height:1.5}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 -16px 8px;padding:env(safe-area-inset-top,0px) 16px 0;position:sticky;top:0;z-index:10;background:var(--bg)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font-weight:600;color:var(--mute);cursor:pointer}
.tabs button[aria-current=page]{color:var(--acc);border-color:var(--acc)}
.tabs .mbtn{flex:0 0 44px;border-bottom-color:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center}
.menu{position:absolute;right:12px;top:100%;margin-top:6px;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:4px}
.menu[hidden]{display:none}
@media(max-width:430px){.tabs button{font-size:.9rem;white-space:nowrap}}
.tabs .menu button{flex:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:8px;color:var(--ink);font-weight:600}
.tabs .menu button:hover,.tabs .menu button:focus-visible{background:var(--bg)}
.tabs .menu .mlink{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;color:var(--ink);font-weight:600;text-decoration:none}
.tabs .menu .mlink:hover,.tabs .menu .mlink:focus-visible{background:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--line);margin:2px 8px}
.menu svg{flex:none;color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.item img{width:96px;height:96px;flex:none;object-fit:cover;border-radius:10px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 5px;border-radius:6px;color:#fff;font-size:.75rem;font-weight:700;letter-spacing:.02em}
.tagx{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:.75rem;color:var(--mute)}
.open{flex:1;text-align:left;background:none;border:0;padding:4px;cursor:pointer;min-width:0}
.open b{display:block;font-size:1.05rem}
.pill{border:1px solid var(--acc);background:none;color:var(--acc);border-radius:99px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.pill[aria-pressed=true]{background:var(--acc);color:var(--on)}
.mute{color:var(--mute);font-size:.9rem}
.hero{width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.nut{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:12px}
.step{background:var(--card);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:1.3rem;cursor:pointer}
ul.ing{list-style:none;padding:0;margin:0}
ul.ing li{padding:10px 0;border-bottom:1px solid var(--line)}
ul.ing label{display:flex;gap:10px;margin:0;font-weight:400;cursor:pointer}
ul.ing input{width:auto}
.done{text-decoration:line-through;color:var(--mute)}
.method p{margin:0 0 14px}
.sug:not(:empty){border:1px solid var(--line);border-radius:8px;background:var(--card);margin-top:4px;overflow:hidden}
.sg{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.sg:last-child{border-bottom:0}
#pv{max-width:160px;border-radius:8px;margin-top:8px}
.home{display:inline-block;color:var(--mute);font-size:.9rem;text-decoration:none;margin-bottom:4px}
.home:hover{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body><main id="app"></main>
